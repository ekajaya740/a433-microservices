apiVersion: v1
kind: ConfigMap
metadata:
  name: mongo-config
  namespace: karsajobs-ns
data:
  mongod.conf: |
    storage:
      dbPath: /data/db
      journal:
        enabled: true
    systemLog:
      destination: file
      path: /var/log/mongodb/mongod.log
      logAppend: true
    security:
      authorization: enabled
